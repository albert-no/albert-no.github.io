name: Build CV

on:
  push:
    branches: [master]

concurrency:
  group: build-cv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync CV publications from publications.html
        run: python3 scripts/sync_cv.py

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/main.tex
          work_in_root_file_dir: true
        # Reproducibility (identical sources -> identical bytes) is handled in
        # the tex preambles (\pdfinfoomitdate etc.); env vars don't reach the
        # action's Docker container.

      - name: Publish PDFs if changed
        run: |
          cp cv/main.pdf cv.pdf
          if git diff --quiet -- cv.pdf cv/main.tex; then
            echo "CV unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf cv/main.tex
          git commit -m "Sync and rebuild CV from publications.html [auto]"
          git pull --rebase origin master
          git push
